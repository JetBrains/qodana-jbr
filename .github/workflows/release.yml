name: Release Qodana JBR

on:
  workflow_dispatch:
    inputs:
      jbr-tag:
        description: "JetBrains Runtime release tag to build from, e.g. jbr-release-25.0.4.1b635.79. Leave empty to use the latest release."
        required: false
        default: ""

jobs:
  prepare:
    name: Prepare data
    runs-on: ubuntu-latest
    env:
      SOURCE_FLAVOR: "linux-x64"
      JARS_DIR: "./jars"
    outputs:
      JBR_VERSION: ${{ steps.detect-jbr.outputs.version }}
      JBR_BUILD: ${{ steps.detect-jbr.outputs.build }}
      JDEPS_LIST: ${{ steps.jmods-list.outputs.uniqueJdeps }}
    steps:
      - name: Detect JBR version
        id: detect-jbr
        env:
          GH_TOKEN: ${{ github.token }}
          JBR_TAG: ${{ inputs.jbr-tag }}
        run: |
          if [[ -n "$JBR_TAG" ]]; then
            if [[ ! "$JBR_TAG" =~ ^jbr-release-[0-9.]+b[0-9.]+$ ]]; then
              echo "Invalid jbr-tag '$JBR_TAG', expected a tag like jbr-release-25.0.4.1b635.79"
              exit 1
            fi
            tagName=$(gh -R https://github.com/JetBrains/JetBrainsRuntime release view "$JBR_TAG" --json tagName --jq .tagName)
          else
            tagName=$(gh -R https://github.com/JetBrains/JetBrainsRuntime release view --json tagName --jq .tagName)
          fi
          version=$(echo "$tagName" | sed -n 's/jbr-release-\(.*\)b.*/\1/p')
          build=$(echo "$tagName" | sed -n 's/.*\(b.*\)/\1/p')

          echo "Detected JBR version $version, build $build"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "build=$build" >> $GITHUB_OUTPUT

      - name: Download latest ${{ env.SOURCE_FLAVOR }} JBR
        id: download-jbr
        run: |
          version="${{ steps.detect-jbr.outputs.version }}"
          build="${{ steps.detect-jbr.outputs.build }}"
          jbrName="jbrsdk-$version-$SOURCE_FLAVOR-$build"
          
          echo Downloading "$jbrName"
          jbrArchivePath="${jbrName}.tar.gz"
          curl -L -# -o "$jbrArchivePath" "https://cache-redirector.jetbrains.com/intellij-jbr/${jbrName}.tar.gz"
          
          echo Unpacking "$SOURCE_FLAVOR" JBR
          tar -xzf "$jbrArchivePath"
          echo -e "\nDownloaded $SOURCE_FLAVOR JBR:"
          ls -lh | grep tar.gz | tr -s ' ' | cut -d' ' -f9,5
          echo "jbrName=$jbrName" >> $GITHUB_OUTPUT

      - name: Fetch qodana-cli dependencies
        run: |
          curl -L -# -O https://raw.githubusercontent.com/JetBrains/qodana-cli/main/internal/tooling/pom.xml 
          mvn -q dependency:copy-dependencies -DoutputDirectory="$JARS_DIR"
          ls -lh $JARS_DIR | tr -s ' ' | cut -d' ' -f9,5

      - name: Generate jmods list
        id: jmods-list
        run: |
          jdeps=$(find "${{ steps.download-jbr.outputs.jbrName }}" -name "jdeps" -type f | head -n 1)

          merged=''
          for file in "${JARS_DIR}"/*; do
            if [[ -f "$file" ]]; then
              curJdeps=$("$jdeps" --list-deps --ignore-missing-deps "$file")

              if [[ "$curJdeps" == Error:* ]]; then
                echo Error detected in jdeps output for "$file":
                echo "$curJdeps"
                exit 1
              fi
              echo -e "\nDetected jmods for $(basename "$file"):"
              echo "$curJdeps"
              merged="$merged $curJdeps"
            fi
          done

          uniqueJdeps=$(echo "$merged" | tr ' ' '\n' | sort -u | tr '\n' ',' | sed 's/^,//;s/,$//')
          echo -e "\nCommon list of jmods to include in qodana-jbrs:\n${uniqueJdeps} \n"
          echo "uniqueJdeps=$uniqueJdeps" >> $GITHUB_OUTPUT

  build:
    name: ${{ matrix.flavor }} qodana-jbr
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            flavor: "linux-x64"
          - runner: ubuntu-24.04-arm
            flavor: "linux-aarch64"
          - runner: macos-latest
            flavor: "osx-aarch64"
          - runner: macos-15-intel
            flavor: "osx-x64"
          - runner: windows-latest
            flavor: "windows-x64"
          - runner: windows-11-arm
            flavor: "windows-aarch64"
    steps:
      - name: Download latest ${{ matrix.flavor }} JBR
        id: download-jbr
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.JBR_VERSION }}"
          build="${{ needs.prepare.outputs.JBR_BUILD }}"
          flavor="${{ matrix.flavor }}"
          jbrName="jbrsdk-$version-$flavor-$build"

          echo Downloading "$jbrName"
          jbrArchivePath="${jbrName}.tar.gz"
          curl -L -# -o "$jbrArchivePath" "https://cache-redirector.jetbrains.com/intellij-jbr/${jbrName}.tar.gz"
      
          echo "Unpacking $flavor JBR"
          tar -xzf "$jbrArchivePath"
          echo -e "\nDownloaded $flavor JBR:"
          ls -lh | grep tar.gz | tr -s ' ' | cut -d' ' -f9,5
          
          echo "jbrName=$jbrName" >> $GITHUB_OUTPUT

      - name: Generate ${{ matrix.flavor }} qodana-jbr
        id: generate-qodana-jbr
        shell: bash
        run: |
          distDirectory="./dist"
          mkdir -p "$distDirectory"
          uniqueJdeps="${{ needs.prepare.outputs.JDEPS_LIST }}"
          jbrName="${{ steps.download-jbr.outputs.jbrName }}"
          flavor="${{ matrix.flavor }}"
          
          jlinkName=$([[ "$flavor" == windows* ]] && echo "jlink.exe" || echo "jlink")
          jlink=$(find "${jbrName}" -name "${jlinkName}")
          targetModulePath=$(find "${jbrName}" -name "jmods" -type d)
          qdJbrName=qodana-$jbrName
          
          echo -e "\nRunning $jlink"
          "$jlink" \
          --module-path "$targetModulePath" \
          --compress=zip-6 \
          --add-modules "$uniqueJdeps" \
          --no-header-files \
          --no-man-pages \
          --strip-debug \
          --output "${distDirectory}/${qdJbrName}"

          archivePath="${distDirectory}/${qdJbrName}.tar.gz"
          tar -czf "$archivePath" -C "$distDirectory" "$qdJbrName"
          echo -e "Generated qodana-jbr: ${qdJbrName}\n"

          echo -e "\nArtifact marked for publish:"
          ls -lh "$distDirectory" | grep tar.gz | tr -s ' ' | cut -d' ' -f9,5
          echo "qdJbrName=${qdJbrName}" >> $GITHUB_OUTPUT
          echo "archivePath=$archivePath" >> $GITHUB_OUTPUT

      # emSign ECC Root CA - G3 and AAA Certificate Services are distrusted and must not be shipped (QD-16607)
      - name: Check ${{ matrix.flavor }} qodana-jbr trust store
        shell: bash
        run: |
          jbrName="${{ steps.download-jbr.outputs.jbrName }}"
          cacerts="./dist/${{ steps.generate-qodana-jbr.outputs.qdJbrName }}/lib/security/cacerts"
          keytoolName=$([[ "${{ matrix.flavor }}" == windows* ]] && echo "keytool.exe" || echo "keytool")
          keytool=$(find "${jbrName}" -name "${keytoolName}" -type f | head -n 1)

          if ! certs=$("$keytool" -list -v -keystore "$cacerts" -storepass changeit 2>&1 | tr -d '\r'); then
            echo "Cannot read $cacerts: $certs"
            exit 1
          fi
          count=$(grep -c 'SHA256:' <<< "$certs" || true)
          if (( count == 0 )); then
            echo "No certificates found in $cacerts"
            exit 1
          fi
          distrusted='SHA256: (86:A1:EC:BA:08:9C:4A:8D:3B:BE:27:34:C6:12:BA:34:1D:81:3E:04:3C:F9:E8:A8:62:CD:5C:57:A3:6B:BE:6B|D7:A7:A0:FB:5D:7E:27:31:D7:71:E9:48:4E:BC:DE:F7:1D:5F:0C:3E:0A:29:48:78:2B:C8:3E:E0:EA:69:9E:F4)$'
          if grep -qE "$distrusted" <<< "$certs"; then
            echo "$cacerts trusts a distrusted root CA, use a JBR build without it"
            exit 1
          fi
          echo "$cacerts: $count certificates, no distrusted root CA"

      - name: Upload ${{ matrix.flavor }} qodana-jbr
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.generate-qodana-jbr.outputs.qdJbrName }}
          path: ${{ steps.generate-qodana-jbr.outputs.archivePath }}
          if-no-files-found: error

  publish-release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DIST_DIRECTORY: "./dist"
    steps:
      - name: Download all matrix artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ env.DIST_DIRECTORY }}

      - name: List all artifacts
        shell: bash
        run: |
          find $DIST_DIRECTORY -type f -maxdepth 3

      - name: Generate tag
        id: tag
        shell: bash
        run: |
          version='${{ needs.prepare.outputs.JBR_VERSION }}'
          build='${{ needs.prepare.outputs.JBR_BUILD }}'
          workflowRunNumber='${{ github.run_number }}'
          
          tag="v${version}${build}.${workflowRunNumber}"
          
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Generated tag for Qodana JBR release: $tag"

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ needs.prepare.outputs.JBR_VERSION }}'
          build='${{ needs.prepare.outputs.JBR_BUILD }}'
          tag='${{ steps.tag.outputs.tag }}'
          title="${tag}"
          notes="Qodana JBR release based on JetBrains Runtime $version build $build"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes "$notes"

      - name: Upload all assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.tag.outputs.tag }}'
          assets=($DIST_DIRECTORY/**/*.tar.gz)

          if (( ${#assets[@]} == 0 )); then
            echo "No .tar.gz assets found to upload."
            exit 1
          fi

          gh release upload "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber