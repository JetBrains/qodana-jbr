name: Check JBR Version

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JARS_DIR: "./jars"
    steps:
      - name: Detect latest JBR version
        id: detect-jbr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tagName=$(gh -R https://github.com/JetBrains/JetBrainsRuntime release view --json tagName --jq .tagName)
          version=$(echo "$tagName" | sed -n 's/jbr-release-\(.*\)b.*/\1/p')
          build=$(echo "$tagName" | sed -n 's/.*\(b.*\)/\1/p')
    
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "build=$build" >> $GITHUB_OUTPUT
          echo "::notice::Detected latest available JBR version $version, build $build"
      - name: Fetch qodana-cli dependencies
        run: |
          curl -L -# -O https://raw.githubusercontent.com/JetBrains/qodana-cli/main/internal/tooling/pom.xml 
          mvn -q dependency:copy-dependencies -DoutputDirectory="$JARS_DIR"
          ls -lh $JARS_DIR | tr -s ' ' | cut -d' ' -f9,5