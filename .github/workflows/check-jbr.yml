name: Check JBR Version

on:
  workflow_dispatch:

jobs:
  prepare:
    name: Fetch latest JBR version and generate required jmods list
    runs-on: ubuntu-latest
    env:
      SOURCE_FLAVOR: "linux-x64"
      JARS_DIR: "./jars"
      JBRS_DIR: "./jbr"
    outputs:
      JBR_VERSION: ${{ steps.detect-jbr.outputs.version }}
      JBR_BUILD: ${{ steps.detect-jbr.outputs.build }}
      JDEPS_LIST: ${{ steps.jmods-list.outputs.uniqueJdeps }}
    steps:
      - name: Detect latest JBR version
        id: detect-jbr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tagName=$(gh -R https://github.com/JetBrains/JetBrainsRuntime release view --json tagName --jq .tagName)
          version=$(echo "$tagName" | sed -n 's/jbr-release-\(.*\)b.*/\1/p')
          build=$(echo "$tagName" | sed -n 's/.*\(b.*\)/\1/p')

          echo "version=$version" >> $GITHUB_OUTPUT
          echo "build=$build" >> $GITHUB_OUTPUT
          echo "Detected latest available JBR version $version, build $build"

      - name: Download latest ${{ env.SOURCE_FLAVOR }} JBR
        run: |
          version="${{ steps.detect-jbr.outputs.version }}"
          build="${{ steps.detect-jbr.outputs.build }}"
          curFlavorDir="${JBRS_DIR}/${SOURCE_FLAVOR}"
          mkdir -p "$curFlavorDir"
          jbrArchiveName="jbrsdk-${version}-${SOURCE_FLAVOR}-${build}.tar.gz"
          echo Downloading "$jbrArchiveName"
          curl -L -# -O --output-dir "$curFlavorDir" "https://cache-redirector.jetbrains.com/intellij-jbr/${jbrArchiveName}"
          echo Unpacking "$SOURCE_FLAVOR" JBR
          tar -xzf "${curFlavorDir}"/*.tar.gz -C "$curFlavorDir"

      - name: Fetch qodana-cli dependencies
        run: |
          curl -L -# -O https://raw.githubusercontent.com/JetBrains/qodana-cli/main/internal/tooling/pom.xml 
          mvn -q dependency:copy-dependencies -DoutputDirectory="$JARS_DIR"
          ls -lh $JARS_DIR | tr -s ' ' | cut -d' ' -f9,5

      - name: Generate jmods list
        id: jmods-list
        run: |
          sourceFlavorJdeps=$(find "${JBRS_DIR}"/"${SOURCE_FLAVOR}" -name "jdeps" -type f | head -n 1)

          merged=''
          for file in "${JARS_DIR}"/*; do
            if [[ -f "$file" ]]; then
              curJdeps=$("$sourceFlavorJdeps" --list-deps --ignore-missing-deps "$file")

              if [[ "$curJdeps" == Error:* ]]; then
                echo Error detected in jdeps output for "$file":
                echo "$curJdeps"
                exit 1
              fi
              echo -e "\nDetected jmods for $(basename "$file"):"
              echo "$curJdeps"
              merged="$merged $curJdeps"
            fi
          done

          uniqueJdeps=$(echo "$merged" | tr ' ' '\n' | sort -u | tr '\n' ',' | sed 's/^,//;s/,$//')
          echo "uniqueJdeps=$uniqueJdeps" >> $GITHUB_OUTPUT
          echo -e "\nCommon list of jmods to include in qodana-jbrs:\n${uniqueJdeps} \n"

  build:
    name: Generate ${{ matrix.flavor }} qodana-jbr
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            flavor: "linux-x64"
          - runner: ubuntu-24.04-arm
            flavor: "linux-aarch64"
          - runner: macos-latest
            flavor: "osx-aarch64"
          - runner: macos-13
            flavor: "osx-x64"
          - runner: windows-latest
            flavor: "windows-x64"
          - runners: windows-11-arm
            flavor: "windows-aarch64"
    env:
      JBRS_DIR: "./jbrs"
      QODANA_JBRS_DIR: "./qodana-jbrs"
    steps:
      - name: Download latest JBR
        id: download-jbr
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.JBR_VERSION }}"
          build="${{ needs.prepare.outputs.JBR_BUILD }}"
          flavor="${{ matrix.flavor }}"
          curFlavorDir="${JBRS_DIR}/${flavor}"
          mkdir -p "$curFlavorDir"
          jbrArchiveName="jbrsdk-$version-$flavor-$build.tar.gz"
          echo Downloading "$jbrArchiveName"
          curl -L -# -O --output-dir "$curFlavorDir" "https://cache-redirector.jetbrains.com/intellij-jbr/${jbrArchiveName}"
          echo Unpacking "$flavor" JBR
          tar -xzf "${curFlavorDir}"/*.tar.gz -C "$curFlavorDir"
      - name: Generate ${{ matrix.flavors }} qodana-jbrs
        shell: bash
        run: |
          uniqueJdeps="${{ needs.prepare.outputs.JDEPS_LIST  }}"
          mkdir -p "$QODANA_JBRS_DIR"
          flavor="${{ matrix.flavor }}"
          jlinkName=$([[ "$flavor" == windows* ]] && echo "jlink.exe" || echo "jlink")
          flavorJlink=$(find "${JBRS_DIR}"/"${flavor}" -name "${jlinkName}")
          for directory in "${JBRS_DIR}"/*/*; do
            if [[ -d $directory ]]; then
              pwd
              echo Working directory: "$directory"
              targetModulePath=$(find "$directory" -name "jmods" -type d)
              qdJbrName=qodana-$(basename "$directory")
              echo Generating "$qdJbrName"
              "$flavorJlink" \
              --module-path "$targetModulePath" \
              --compress=zip-6 \
              --add-modules "$uniqueJdeps" \
              --no-header-files \
              --no-man-pages \
              --strip-debug \
              --output "${QODANA_JBRS_DIR}/${qdJbrName}"

              archive_name="${QODANA_JBRS_DIR}/${qdJbrName}.tar.gz"
              tar -czf "$archive_name" -C "$QODANA_JBRS_DIR" "$qdJbrName"
              echo -e "Created qodana-jbr archive: ${archive_name}\n"
            fi
          done
          echo Artifact marked for publish:
          ls -lh "$QODANA_JBRS_DIR"